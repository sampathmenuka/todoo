<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
<div class="header-outer" style="margin-bottom: 50px;">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Todoist_logo.png" alt="">
    </div>
    <div class="signup">
        <button id="btnLogout" class="btn btn-primary btn-sm">Logout</button>
    </div>
</div>

<div class="container" >
    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">
                        + Add new Todo
                    </h5>
                </div>
                <div class="card-body">
                   <form id="todoForm">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="todotitle" class="form-label">Title *</label>
                                <input type="text" class="form-control" id="todotitle" placeholder="Enter todo title">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="todoDescription" class="form-label">Description *</label>
                                <input type="text" class="form-control" id="todoDescription" placeholder="Enter todo description">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="todoDuedate" class="form-label">Due date *</label>
                                <input type="text" class="form-control" id="todoDuedate" placeholder="Enter due date">
                            </div>
                            <div class="col-12">
                                <button class="btn col-12 btn-primary" type="submit">Add Todo </button>
                            </div>
                        </div>
                   </form>
                </div>
            </div>
        </div>
        <div class="col-12">
            <ul class="nav nav-tabs mb-4" id="todotabs">
                <li class="nav-tabs mb-4">
                    <li class="nav-item">
                        <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all">All Todos</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link active" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending">Pending Todos</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link active" id="completed-tab" data-bs-toggle="tab" data-bs-target="#completed">Completed Todos</button>
                    </li>
                </li>

            </ul>
        </div>
    </div>
</div>

<script>

    const token = localStorage.getItem('token');
    if(!token){
        window.location.href='login.html';
    }

    document.getElementById('btnLogout').addEventListener('click', function (){
        localStorage.removeItem('token');
        window.location.href='index.html';
    })
</script>
</body>
</html>
